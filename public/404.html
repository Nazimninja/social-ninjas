<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Page Not Found | Social Ninja's</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #07090e;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 16px;
      color: #ffffff;
    }
    p {
      font-size: 16px;
      color: #94a3b8;
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    a.btn {
      display: inline-block;
      background: #1F4B99;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #153880;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The requested page or service does not exist or may have been relocated.</p>
  <a href="/" class="btn">Return to Social Ninja's</a>
</body>
</html>
